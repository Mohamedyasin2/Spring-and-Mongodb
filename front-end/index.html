<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Managmnet System</title>
</head>

<body>
    <form action="http://localhost:8080/addemployee" method="post">
        <h3>Employee Managment System</h3>

        <label for="empId">Enter Employee Id:</label>
        <input type="number" name="empId"><br>

        <label for="empName">Enter Employee Name:</label>
        <input type="text" name="empName"><br>

        <label for="empEmail">Enter Employee Email:</label>
        <input type="email" name="empEmail"><br>

        <label for="empLocation">Enter Employee Location:</label>
        <input type="text" name="empLocation"><br>

        <button type="submit">Add Employee</button>

    </form>

</body>

</html>
